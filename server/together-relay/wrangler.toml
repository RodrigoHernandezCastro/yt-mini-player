# Watch together relay for YT Mini Player.
# Deploy with: npx wrangler deploy   (see README.md next to this file)
name = "ytmp-together"
main = "src/index.js"
compatibility_date = "2026-06-01"
workers_dev = true
preview_urls = false

[[durable_objects.bindings]]
name = "ROOM"
class_name = "Room"

[[durable_objects.bindings]]
name = "LOBBY"
class_name = "Lobby"

# SQLite-backed Durable Objects: available on the Workers free plan.
[[migrations]]
tag = "v1"
new_sqlite_classes = ["Room", "Lobby"]

# Nothing is logged.
[observability]
enabled = false

# Limits per address (Workers rate limiting): how often one address may try
# codes, open rooms and get TURN logins. Without them anyone could guess
# codes at full speed, or open rooms just to take TURN logins that you pay
# for. A block removed turns its limit off.
[[ratelimits]]
name = "JOIN_LIMIT"
namespace_id = "1001"
simple = { limit = 20, period = 60 }

[[ratelimits]]
name = "HOST_LIMIT"
namespace_id = "1002"
simple = { limit = 10, period = 60 }

[[ratelimits]]
name = "ICE_LIMIT"
namespace_id = "1003"
simple = { limit = 10, period = 60 }

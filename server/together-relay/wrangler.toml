# Watch together relay for YT Mini Player.
# Deploy with: npx wrangler deploy   (see README.md next to this file)
name = "ytmp-together"
main = "src/index.js"
compatibility_date = "2026-06-01"
workers_dev = true
preview_urls = false

[[durable_objects.bindings]]
name = "ROOM"
class_name = "Room"

[[durable_objects.bindings]]
name = "LOBBY"
class_name = "Lobby"

# SQLite-backed Durable Objects: available on the Workers free plan.
[[migrations]]
tag = "v1"
new_sqlite_classes = ["Room", "Lobby"]

# Nothing is logged.
[observability]
enabled = false

# Optional: limits how often one address may try codes. Uncomment if your
# account has Workers rate limiting.
# [[ratelimits]]
# name = "JOIN_LIMIT"
# namespace_id = "1001"
# simple = { limit = 20, period = 60 }

[package]
name = "yt-mini-player"
version = "0.2.0"
edition = "2021"
description = "Reproductor flotante de YouTube sobre WebView2 (tao + wry)"
publish = false
build = "build.rs"

[dependencies]
tao = "0.37"
wry = "0.57"
directories = "6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"
zip = { version = "2", default-features = false, features = ["deflate"] }

[target.'cfg(windows)'.dependencies]
tray-icon = "0.26"
global-hotkey = "0.8"
webview2-com = "0.39"
windows = { version = "0.62", features = ["Win32_Foundation"] }
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_System_DataExchange",
    "Win32_System_Memory",
    "Win32_System_Ole",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[build-dependencies]
winresource = "0.1"

[profile.release]
opt-level = "s"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

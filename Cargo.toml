[package]
name = "yt-mini-player"
version = "0.7.0"
edition = "2021"
description = "Reproductor flotante de YouTube sobre WebView2 (tao + wry)"
publish = false
build = "build.rs"

[dependencies]
tao = "0.37"
wry = "0.57"
directories = "6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"
http = "1"
zip = { version = "9", default-features = false, features = ["deflate"] }
# Cifrado (RustCrypto, auditados): AES-256-GCM para la bóveda, Argon2id para
# el PIN, SHA-256 para huellas de extensiones; claves borradas de memoria.
aes-gcm = { version = "0.11", features = ["zeroize"] }
argon2 = { version = "0.5", features = ["std"] }
sha2 = "0.11"
zeroize = "1"
getrandom = "0.4"
# Mi música: HTTP (Internet Archive, Lemon Squeezy), etiquetas, decodificación
# y huella acústica (Chromaprint en Rust puro) para detectar duplicados.
ureq = { version = "3.4", default-features = false, features = ["json"] }
lofty = "0.25"
symphonia = { version = "0.6", default-features = false, features = ["mp3", "flac", "aac", "isomp4", "ogg", "vorbis", "wav", "pcm"] }
rusty-chromaprint = "0.3"
walkdir = "2.5"
sha1 = "0.11"
base64 = "0.23"

[target.'cfg(windows)'.dependencies]
# TLS del sistema (SChannel): certificados y políticas de Windows.
ureq = { version = "2.12", default-features = false, features = ["json", "native-tls"] }
native-tls = "0.2"
tray-icon = "0.26"
global-hotkey = "0.8"
webview2-com = "0.39"
windows = { version = "0.62", features = [
    "Foundation",
    "Security_Credentials_UI",
    "Win32_Foundation",
    "Win32_System_Com",
    "Win32_System_WinRT",
    "Win32_UI_Accessibility",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
] }
windows-future = "0.100"
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_Security_Cryptography",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_DataExchange",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_Ole",
    "Win32_System_Registry",
    "Win32_System_RemoteDesktop",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_UI_Accessibility",
    "Win32_UI_HiDpi",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    "Win32_UI_WindowsAndMessaging",
] }

[build-dependencies]
winresource = "0.1"

[profile.release]
opt-level = "s"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

[package]
name = "yt-mini-player"
version = "0.6.1"
edition = "2021"
description = "Reproductor flotante de YouTube sobre WebView2 (tao + wry)"
publish = false
build = "build.rs"

[dependencies]
tao = "0.37"
wry = "0.57"
directories = "6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"
http = "1"
zip = { version = "9", default-features = false, features = ["deflate"] }
# Cifrado (RustCrypto, auditados): AES-256-GCM para la bóveda, Argon2id para
# el PIN, SHA-256 para huellas de extensiones; claves borradas de memoria.
aes-gcm = { version = "0.10", features = ["zeroize"] }
argon2 = { version = "0.5", features = ["std"] }
sha2 = "0.10"
zeroize = "1"
getrandom = "0.3"

[target.'cfg(windows)'.dependencies]
tray-icon = "0.26"
global-hotkey = "0.8"
webview2-com = "0.39"
windows = { version = "0.62", features = [
    "Foundation",
    "Security_Credentials_UI",
    "Win32_Foundation",
    "Win32_System_Com",
    "Win32_System_WinRT",
    "Win32_UI_Accessibility",
] }
windows-future = "0.3"
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_Security_Cryptography",
    "Win32_Storage_FileSystem",
    "Win32_System_DataExchange",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_Ole",
    "Win32_System_Registry",
    "Win32_System_RemoteDesktop",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_UI_Accessibility",
    "Win32_UI_HiDpi",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[build-dependencies]
winresource = "0.1"

[profile.release]
opt-level = "s"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

[package]
name = "yt-mini-player"
version = "0.13.3"
edition = "2021"
description = "Floating YouTube player on WebView2 (tao + wry)"
publish = false
build = "build.rs"

[features]
# The drivable test build for the Windows end-to-end tests (src/e2e.rs).
# Never in a release: tools/package.ps1 refuses it.
e2e = []

[dependencies]
tao = "0.37"
wry = "0.57"
directories = "6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"
http = "1"
zip = { version = "9", default-features = false, features = ["deflate"] }
# Encryption (RustCrypto, audited): AES-256-GCM for the vault, Argon2id for
# the PIN, SHA-256 for extension fingerprints; keys wiped from memory.
aes-gcm = { version = "0.11", features = ["zeroize"] }
argon2 = { version = "0.5", features = ["std"] }
sha2 = "0.11"
zeroize = "1"
getrandom = "0.4"
# My music: HTTP (Internet Archive, Lemon Squeezy), tags, decoding and
# acoustic fingerprints (Chromaprint in pure Rust) to find duplicates.
ureq = { version = "3.5", default-features = false, features = ["json"] }
lofty = "0.25"
symphonia = { version = "0.6", default-features = false, features = ["mp3", "flac", "aac", "isomp4", "ogg", "vorbis", "wav", "pcm"] }
rusty-chromaprint = "0.3"
walkdir = "2.5"
sha1 = "0.11"
base64 = "0.23"
# Watch together: the invitation code (HMAC-SHA256), the handshake
# (X25519 + HKDF) and the connection to the relay (WebSocket). TLS comes
# from native-tls below, so on Windows it is SChannel as well.
hmac = "0.13"
hkdf = "0.13"
x25519-dalek = { version = "3", features = ["static_secrets", "zeroize"] }
tungstenite = { version = "0.30", default-features = false, features = ["handshake"] }

[target.'cfg(windows)'.dependencies]
# The system's TLS (SChannel): Windows' certificates and policies.
ureq = { version = "2.12", default-features = false, features = ["json", "native-tls"] }
native-tls = "0.2"
tray-icon = "0.26"
global-hotkey = "0.9"
webview2-com = "0.39"
windows = { version = "0.62", features = [
    "Foundation",
    "Security_Credentials_UI",
    "Win32_Foundation",
    "Win32_Media_Audio",
    "Win32_Security",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Threading",
    "Win32_System_Variant",
    "Win32_System_WinRT",
    "Win32_UI_Accessibility",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
] }
windows-future = "0.100"
# The `implement` macro (loopback.rs' COM callback) refers to it by name.
windows-core = "0.100"
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_Globalization",
    "Win32_Security",
    "Win32_Security_Cryptography",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_DataExchange",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_Kernel",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_Ole",
    "Win32_System_Registry",
    "Win32_System_RemoteDesktop",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_UI_Accessibility",
    "Win32_UI_Controls",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    "Win32_UI_WindowsAndMessaging",
] }

[build-dependencies]
winresource = "0.1"

[profile.release]
opt-level = "s"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

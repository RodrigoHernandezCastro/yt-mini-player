<!doctype html>
<html lang="__YTMP_LANG__">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title data-i18n="music.title"></title>
<style>
  :root {
    /* The app's palette: deep twilight ground, light cyan text, turquoise
       only where something can be pressed or is current. Flat. */
    --deep: #03045e;
    --french: #023e8a;
    --teal: #0077b6;
    --blue-green: #0096c7;
    --turquoise: #00b4d8;
    --sky: #48cae4;
    --frost: #90e0ef;
    --frost-2: #ade8f4;
    --cyan: #caf0f8;
    --tide: linear-gradient(90deg, var(--teal), var(--blue-green), var(--turquoise), var(--sky), var(--frost), var(--frost-2), var(--cyan));
    --ink: var(--deep);
    --ink-2: rgba(2, 62, 138, .28);
    --panel: rgba(2, 62, 138, .5);
    --panel-2: var(--teal);
    --line: var(--french);
    --line-soft: rgba(2, 62, 138, .7);
    --line-strong: var(--teal);
    --text: var(--cyan);
    --muted: var(--frost-2);
    --dim: rgba(144, 224, 239, .65);
    --accent: var(--turquoise);
    --accent-2: var(--sky);
    --accent-ink: var(--deep);
    --ok: var(--sky);
    --warn: #ff9f8a;
    --danger: #ff9f8a;
    --row: 46px;
    --display: "Segoe UI Variable Display", "Segoe UI", "Yu Gothic UI", "Meiryo UI", system-ui, sans-serif;
    --body: "Segoe UI Variable Text", "Segoe UI", "Yu Gothic UI", "Meiryo UI", system-ui, sans-serif;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--ink); color: var(--text); overflow: hidden; }
  body { background: radial-gradient(70% 50% at 100% 0%, rgba(0, 119, 182, .22), transparent 70%), var(--ink); }
  body { font: 13px/1.4 var(--body); -webkit-font-smoothing: antialiased; display: flex; flex-direction: column; }
  button, input, select { font: inherit; color: inherit; }
  button { background: none; border: 0; margin: 0; padding: 0; cursor: pointer; }
  button:disabled { cursor: default; opacity: .45; }
  :focus-visible { outline: 2px solid var(--accent-2); outline-offset: 2px; }
  /* Fields show focus with their own border. */
  input:focus-visible, select:focus-visible { outline: none; border-color: var(--accent); }
  [hidden] { display: none !important; }
  svg { width: 18px; height: 18px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
  svg.fill { fill: currentColor; stroke: none; }

  /* --- Header (drags the window) and tabs --- */
  header {
    display: flex; align-items: center; gap: 10px; padding: 8px 44px 0 12px; user-select: none; cursor: grab;
    background: linear-gradient(180deg, rgba(2, 62, 138, .55), rgba(3, 4, 94, 0)); flex: none;
    border-bottom: 2px solid; border-image: var(--tide) 1;
  }
  .brand { display: flex; align-items: center; gap: 8px; padding-bottom: 8px; font: 600 17px/1 var(--display); white-space: nowrap; }
  .brand .back { display: grid; place-items: center; width: 26px; height: 26px; border-radius: 4px; color: var(--muted); }
  .brand .back:hover { background: var(--panel); color: var(--text); }
  .brand .logo { display: grid; place-items: center; width: 24px; height: 24px; border-radius: 50%; color: var(--deep); background: linear-gradient(135deg, var(--sky), var(--blue-green)); }
  .brand .logo svg { width: 14px; height: 14px; }
  .brand .logo svg { width: 15px; height: 15px; }
  nav { display: flex; gap: 2px; margin-left: auto; overflow-x: auto; scrollbar-width: none; }
  nav button {
    display: flex; align-items: center; gap: 6px; padding: 7px 10px 9px; color: var(--muted); white-space: nowrap;
    border-bottom: 2px solid transparent; cursor: pointer;
  }
  nav button:hover { color: var(--text); }
  nav button[aria-selected="true"] { color: var(--cyan); border-bottom-color: var(--turquoise); }
  nav button[aria-selected="true"] svg { color: var(--sky); }
  nav button svg { width: 16px; height: 16px; }
  nav .count { font-size: 11px; color: var(--accent); }

  main { flex: 1; min-height: 0; position: relative; }
  section.tab { position: absolute; inset: 0; display: flex; flex-direction: column; min-height: 0; }
  .toolbar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; padding: 10px 12px 8px; flex: none; }
  .scroll { flex: 1; min-height: 0; overflow-y: auto; overflow-x: hidden; position: relative; }
  .pad { padding: 4px 12px 16px; }

  input[type="search"], input[type="text"], select {
    height: 32px; padding: 0 12px; border-radius: 16px; background: rgba(3, 4, 94, .7); border: 1px solid var(--line-strong); color: var(--text); min-width: 0;
  }
  input::placeholder { color: var(--dim); }
  input[type="search"] { flex: 1 1 160px; }
  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 6px; height: 32px; padding: 0 14px; border-radius: 16px;
    background: var(--panel); border: 1px solid var(--line-strong); white-space: nowrap; color: var(--frost-2);
  }
  .btn:hover:not(:disabled) { background: var(--teal); color: var(--cyan); }
  .btn.primary { background: linear-gradient(90deg, var(--blue-green), var(--turquoise)); color: var(--accent-ink); border-color: transparent; font-weight: 600; }
  .btn.primary:hover:not(:disabled) { background: linear-gradient(90deg, var(--turquoise), var(--sky)); color: var(--accent-ink); }
  .btn.ghost { background: none; border-color: transparent; color: var(--muted); }
  .btn.ghost:hover:not(:disabled) { color: var(--text); background: var(--panel); }
  .btn.danger { color: var(--danger); }
  .btn.icon { width: 32px; padding: 0; border-radius: 50%; }
  .btn .lock { width: 13px; height: 13px; color: var(--warn); }
  .muted { color: var(--muted); }
  .small { font-size: 12px; }
  .status-line { padding: 0 12px 6px; color: var(--muted); font-size: 12px; flex: none; }
  .status-line .bar { height: 3px; border-radius: 2px; background: var(--line); margin-top: 4px; overflow: hidden; }
  .status-line .bar > span { display: block; height: 100%; background: var(--tide); transition: width .2s; }

  /* --- Song lists (virtual) --- */
  .list { position: relative; }
  .list .window { position: absolute; left: 0; right: 0; top: 0; }
  .row {
    height: var(--row); display: grid; grid-template-columns: 34px minmax(0, 1fr) auto auto; align-items: center; gap: 10px;
    padding: 0 8px 0 12px; border-bottom: 1px solid var(--line-soft); cursor: pointer;
  }
  .row:hover { background: var(--ink-2); }
  .row.playing { background: linear-gradient(90deg, rgba(0, 150, 199, .32), rgba(2, 62, 138, .12) 70%, transparent); box-shadow: inset 3px 0 0 var(--turquoise); }
  .row.playing .title { color: var(--sky); }
  .cover { width: 34px; height: 34px; border-radius: 6px; object-fit: cover; background: linear-gradient(135deg, var(--teal), var(--french)); display: grid; place-items: center; color: var(--frost); overflow: hidden; }
  .cover svg { width: 16px; height: 16px; }
  .meta { min-width: 0; }
  .title { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .sub { color: var(--muted); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .time { color: var(--muted); font-variant-numeric: tabular-nums; font-size: 12px; }
  .more { width: 30px; height: 30px; border-radius: 4px; display: grid; place-items: center; color: var(--dim); }
  .more:hover { background: var(--panel); color: var(--text); }
  .badge { display: inline-block; padding: 0 7px; border-radius: 9px; font-size: 11px; font-weight: 600; background: var(--french); color: var(--frost-2); white-space: nowrap; }
  .badge.ok { background: rgba(72, 202, 228, .18); color: var(--sky); }
  .badge.warn { color: var(--warn); }

  .empty { display: grid; place-items: center; text-align: center; padding: 28px 16px; gap: 10px; color: var(--muted); }
  .empty h2 { margin: 0; color: var(--text); font: 600 18px/1.2 var(--display); }
  .empty .actions { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }
  .empty .art { width: 60px; height: 60px; border-radius: 50%; display: grid; place-items: center; color: var(--cyan);
    background: radial-gradient(circle at 50% 35%, var(--teal), var(--french) 70%);
    box-shadow: 0 0 0 1px var(--blue-green), 0 0 0 7px rgba(0, 150, 199, .14); }
  .empty .art svg { width: 26px; height: 26px; stroke-width: 1.6; }

  details.folders { padding: 8px 12px 14px; color: var(--muted); font-size: 12px; }
  details.folders summary { cursor: pointer; }
  details.folders li { display: flex; align-items: center; gap: 6px; margin: 4px 0; }
  details.folders ul { list-style: none; padding: 0; margin: 6px 0 0; }
  details.folders .path { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  /* --- Cards and blocks --- */
  .card { border: 1px solid rgba(0, 150, 199, .4); background: linear-gradient(160deg, rgba(0, 119, 182, .2), rgba(2, 62, 138, .12)); border-radius: 12px; padding: 12px 14px; margin: 0 0 10px; }
  .card h3 { margin: 0 0 4px; font: 600 15px/1.2 var(--display); }
  .note { border-left: 3px solid var(--sky); background: var(--ink-2); padding: 8px 12px; border-radius: 0 10px 10px 0; color: var(--muted); font-size: 12px; margin: 0 0 10px; }
  .note.warn { border-left-color: var(--warn); }
  .note.dev { border-left-color: var(--danger); color: var(--text); }
  /* A plan limit notice: a quiet line, never a window. */
  .notice { flex: none; display: flex; align-items: center; gap: 8px; padding: 6px 8px 6px 12px; font-size: 12px; color: var(--muted);
    background: var(--ink-2); border-bottom: 1px solid var(--line); }
  .notice .text { flex: 1; min-width: 0; }
  .notice .link { color: var(--accent-2); white-space: nowrap; }
  .notice .link:hover { text-decoration: underline; }
  .quota { color: var(--muted); font-size: 12px; }
  .quota strong { color: var(--text); font-weight: 600; }
  .link-btn { color: var(--accent-2); font-size: 12px; }
  .link-btn:hover { text-decoration: underline; }

  /* Archive results */
  .hit { display: grid; grid-template-columns: 44px minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 7px 8px; border-bottom: 1px solid var(--line-soft); cursor: pointer; }
  .hit:hover { background: var(--ink-2); }
  .hit img, .thumb { width: 44px; height: 44px; border-radius: 6px; object-fit: cover; background: linear-gradient(135deg, var(--teal), var(--french)); }
  .album-head { display: grid; grid-template-columns: 72px minmax(0, 1fr); gap: 12px; align-items: center; margin-bottom: 10px; }
  .album-head .thumb { width: 72px; height: 72px; border-radius: 10px; box-shadow: 0 8px 22px rgba(0, 119, 182, .3); }
  .album-head h2 { margin: 0; font: 600 17px/1.2 var(--display); }
  .album-actions { display: flex; flex-wrap: wrap; gap: 8px; margin: 8px 0 10px; }
  .track { display: grid; grid-template-columns: 30px minmax(0, 1fr) auto auto; gap: 8px; align-items: center; padding: 6px 4px; border-bottom: 1px solid var(--line-soft); }
  .track .num { color: var(--dim); text-align: center; font-variant-numeric: tabular-nums; font-size: 12px; }
  .track .state { font-size: 12px; color: var(--muted); white-space: nowrap; }
  .preview { width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; color: var(--turquoise); box-shadow: inset 0 0 0 1px var(--teal); }
  .preview:hover { background: var(--turquoise); color: var(--deep); }
  .pager { display: flex; gap: 8px; align-items: center; justify-content: center; padding: 10px; }

  /* Download queue */
  .jobs { border-top: 1px solid var(--line); background: var(--ink-2); max-height: 38%; display: flex; flex-direction: column; flex: none; }
  .jobs.collapsed .scroll { display: none; }
  .jobs .toggle svg { transition: transform .15s; }
  .jobs.collapsed .toggle svg { transform: rotate(180deg); }
  .jobs header { all: unset; display: flex; align-items: center; gap: 8px; padding: 6px 12px; font-size: 12px; color: var(--muted); }
  .jobs header strong { color: var(--text); }
  .jobs .scroll { padding: 0 12px 8px; }
  .job { display: grid; grid-template-columns: minmax(0, 1fr) auto auto; gap: 8px; align-items: center; padding: 4px 0; font-size: 12px; }
  .job .progress { grid-column: 1 / -1; height: 3px; background: var(--line); border-radius: 2px; overflow: hidden; }
  .job .progress span { display: block; height: 100%; background: var(--tide); }
  .job.done .label { color: var(--ok); }
  .job.skipped .label { color: var(--accent-2); }
  .job.failed .label, .job.cancelled .label { color: var(--danger); }

  /* Duplicates */
  .group { border: 1px solid rgba(0, 150, 199, .4); border-radius: 12px; margin-bottom: 10px; overflow: hidden; }
  .group .head { display: flex; align-items: center; gap: 8px; padding: 8px 10px; background: var(--ink-2); flex-wrap: wrap; }
  .group .head .grow { flex: 1; }
  .dupe { display: grid; grid-template-columns: 22px minmax(0, 1fr) auto; gap: 8px; align-items: center; padding: 6px 10px; border-top: 1px solid var(--line-soft); cursor: pointer; }
  .dupe input { accent-color: #00b4d8; }
  .dupe .path { color: var(--dim); font-size: 11.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  /* Plans */
  .plans { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; margin-bottom: 12px; }
  .plan { border: 1px solid rgba(0, 150, 199, .4); border-radius: 14px; padding: 14px; display: flex; flex-direction: column; gap: 8px;
    background: linear-gradient(170deg, rgba(0, 119, 182, .22), rgba(2, 62, 138, .1)); }
  .plan:nth-child(2) { background: linear-gradient(170deg, rgba(0, 150, 199, .26), rgba(2, 62, 138, .1)); }
  .plan:nth-child(3) { background: linear-gradient(170deg, rgba(72, 202, 228, .24), rgba(2, 62, 138, .1)); }
  .plan.current { border-color: var(--sky); box-shadow: 0 0 0 1px var(--sky), 0 12px 30px rgba(0, 180, 216, .2); }
  .plan h3 { margin: 0; font: 600 16px/1.2 var(--display); }
  .plan .price { font: 600 24px/1 var(--display); font-variant-numeric: tabular-nums; color: var(--cyan); }
  .plan h3 { color: var(--sky); }
  .plan li::marker { color: var(--turquoise); }
  .plan .price small { font: 12px var(--body); color: var(--muted); }
  .plan ul { margin: 0; padding: 0 0 0 16px; color: var(--muted); font-size: 12px; flex: 1; }
  .plan li { margin: 3px 0; }
  .license-form { display: flex; gap: 8px; flex-wrap: wrap; }
  .license-form input { flex: 1 1 220px; font-family: Consolas, "Cascadia Mono", monospace; letter-spacing: .02em; }
  .msg { margin: 8px 0 0; font-size: 12px; color: var(--ok); }
  .msg.error { color: var(--danger); }
  dl.facts { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 3px 12px; margin: 6px 0 0; font-size: 12px; }
  dl.facts dt { color: var(--muted); }
  dl.facts dd { margin: 0; overflow: hidden; text-overflow: ellipsis; }

  /* Playlists */
  .playlist-row { display: grid; grid-template-columns: 38px minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 8px; border-bottom: 1px solid var(--line-soft); cursor: pointer; }
  .playlist-row:hover { background: var(--ink-2); }
  .playlist-row .pl-art { width: 38px; height: 38px; border-radius: 8px; display: grid; place-items: center; background: linear-gradient(135deg, var(--blue-green), var(--french)); color: var(--cyan); }
  .pl-head { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 8px; }
  .pl-head input { flex: 1 1 180px; font: 600 15px var(--display); }

  /* --- Player --- */
  footer.player {
    flex: none; display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr); align-items: center; gap: 10px;
    padding: 6px 12px; min-height: 58px; position: relative;
    background: linear-gradient(0deg, var(--french), rgba(2, 62, 138, .55));
    border-top: 1px solid var(--teal);
  }
  .now { display: flex; align-items: center; gap: 10px; min-width: 0; }
  .now .cover { width: 40px; height: 40px; border-radius: 8px; flex: none; box-shadow: 0 0 0 1px rgba(72, 202, 228, .3); }
  .controls { display: flex; flex-direction: column; align-items: center; gap: 2px; min-width: 0; }
  .buttons { display: flex; align-items: center; gap: 4px; }
  .ctl { width: 32px; height: 32px; border-radius: 50%; display: grid; place-items: center; color: var(--muted); }
  .ctl:hover:not(:disabled) { color: var(--text); background: var(--panel); }
  .ctl.on { color: var(--accent); }
  .ctl.play { width: 38px; height: 38px; background: linear-gradient(135deg, var(--sky), var(--blue-green)); color: var(--deep); box-shadow: 0 0 0 4px rgba(0, 180, 216, .18); }
  .ctl.play:hover:not(:disabled) { background: linear-gradient(135deg, var(--frost), var(--turquoise)); color: var(--deep); }
  .ctl.on { color: var(--sky); }
  .seek { display: flex; align-items: center; gap: 8px; width: min(380px, 40vw); font-size: 11px; color: var(--muted); font-variant-numeric: tabular-nums; }
  input[type="range"] { flex: 1; min-width: 0; height: 14px; accent-color: #00b4d8; background: transparent; }
  .extra { display: flex; align-items: center; justify-content: flex-end; gap: 4px; }
  .extra input[type="range"] { max-width: 90px; }
  .preview-tag { color: var(--warn); font-size: 11px; font-weight: 600; }

  /* Notices, menus and dialogs */
  .toast {
    position: fixed; left: 50%; bottom: 70px; transform: translateX(-50%); max-width: min(520px, calc(100vw - 24px));
    background: linear-gradient(90deg, var(--french), var(--deep)); border: 1px solid var(--teal); border-radius: 18px; padding: 8px 16px;
    box-shadow: 0 8px 24px rgba(1, 2, 40, .55);
    font-size: 12.5px; z-index: 30; pointer-events: none;
  }
  .menu {
    position: fixed; z-index: 40; min-width: 200px; background: var(--deep); border: 1px solid var(--teal); border-radius: 10px; padding: 4px 0;
    box-shadow: 0 14px 34px rgba(1, 2, 40, .6);
  }
  .menu button { display: flex; align-items: center; gap: 8px; width: 100%; padding: 7px 12px; text-align: left; }
  .menu button:hover { background: linear-gradient(90deg, var(--french), transparent); }
  .menu .sep { height: 1px; background: var(--line); margin: 4px 0; }
  .menu .danger { color: var(--danger); }
  .scrim { position: fixed; inset: 0; background: rgba(3, 4, 94, .75); z-index: 50; display: grid; place-items: center; padding: 16px; }
  .dialog { width: min(380px, 100%); background: var(--deep); border: 1px solid var(--teal); border-radius: 14px; padding: 16px; display: grid; gap: 10px;
    box-shadow: 0 20px 50px rgba(1, 2, 40, .7); }
  .dialog h2 { color: var(--cyan); }
  .dialog h2 { margin: 0; font: 600 17px/1.2 var(--display); }
  .dialog .actions { display: flex; justify-content: flex-end; gap: 8px; flex-wrap: wrap; }
  .dialog .choices { display: grid; gap: 4px; max-height: 220px; overflow-y: auto; }

  /* Narrow or short windows */
  /* Tabs that do not fit with their names (longer languages, narrower
     windows): icons only, the name stays in the tooltip. */
  header.compact nav button span.label { display: none; }
  header.no-name .brand .name { display: none; }
  @media (max-width: 640px) {
    nav button span.label, .toolbar .btn span.label { display: none; }
    .toolbar .btn:has(span.label) { width: 32px; padding: 0; }
    .plans { grid-template-columns: 1fr; }
    .extra .vol { display: none; }
    footer.player { grid-template-columns: minmax(0, 1fr) auto; }
    .extra { display: none; }
  }
  @media (max-width: 420px) {
    .brand .name { display: none; }
    .row { grid-template-columns: 34px minmax(0, 1fr) auto; }
    .row .time { display: none; }
    .seek { width: 46vw; }
  }
  /* The smallest window: only the player. */
  @media (max-height: 180px) {
    header, main { display: none !important; }
    footer.player { flex: 1; border-top: 0; grid-template-columns: minmax(0, 1fr); align-content: center; gap: 4px; padding: 8px 12px; }
    footer.player .controls { align-items: stretch; }
    footer.player .buttons { justify-content: center; }
    footer.player .seek { display: flex !important; width: 100%; }
    .extra, .toast { display: none !important; }
  }
  @media (max-height: 300px) {
    header { padding-top: 4px; }
    .brand { padding-bottom: 4px; }
    nav button { padding: 4px 8px 6px; }
    .toolbar { padding: 6px 12px 4px; }
    footer.player { min-height: 46px; padding: 3px 10px; }
    .now .cover { width: 32px; height: 32px; }
    .seek { display: none; }
    :root { --row: 40px; }
  }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
  <header data-ytmp-drag>
    <div class="brand">
      <button class="back" id="back" type="button" data-i18n-title="music.back" data-i18n-aria-label="music.back">
        <svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg>
      </button>
      <span class="logo"><svg viewBox="0 0 24 24" class="fill"><path d="M9 18.5a2.5 2.5 0 1 1-2-2.45V6.6l11-2.1v11.95a2.5 2.5 0 1 1-2-2.45V7.3l-7 1.34z"/></svg></span>
      <span class="name" data-i18n="music.title"></span>
    </div>
    <nav role="tablist" data-i18n-aria-label="music.sections">
      <button role="tab" data-tab="library" aria-selected="true" data-i18n-title="music.tab.library">
        <svg viewBox="0 0 24 24"><path d="M4 5h3v14H4zM10 5h3v14h-3zM16.2 5.6l2.9-.8 3.6 13.5-2.9.8z"/></svg><span class="label" data-i18n="music.tab.library"></span>
      </button>
      <button role="tab" data-tab="playlists" aria-selected="false" data-i18n-title="music.tab.playlists">

  // Library (virtual list: only the visible rows are drawn)
  // --------------------------------------------------------------------------
  let view = [];
  const libScroll = $('library-scroll');
  const libList = $('library-list');
  const libWindow = libList.querySelector('.window');
  const rowHeight = () => parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--row')) || 46;

  function computeView() {
    const q = fold($('filter').value.trim());
    const sort = $('sort').value;
    let list = state.tracks;
    if (q) {
      const words = q.split(/\s+/);
      list = list.filter((t) => {
        const hay = fold(`${t.title} ${t.artist} ${t.album}`);
        return words.every((w) => hay.includes(w));
      });
    } else {
      list = list.slice();
    }
    // In the order of the app's language (ł after l in Polish, kana order
    // in Japanese…).
    if (sort === 'title') list.sort((a, b) => compare(a.title, b.title));
    else if (sort === 'artist') list.sort((a, b) => compare(a.artist, b.artist) || compare(a.album, b.album) || (a.trackNo || 0) - (b.trackNo || 0));
    else if (sort === 'album') list.sort((a, b) => compare(a.album, b.album) || (a.trackNo || 0) - (b.trackNo || 0));
    else list.sort((a, b) => (b.added || 0) - (a.added || 0) || compare(a.title, b.title));
    view = list;
  }

  function trackRow(t, onPlay, extraMenu) {
    const playing = player.preview === null && player.queue[player.index] === t.id;
    const more = el('button', { class: 'more', type: 'button', title: tx('music.more'), 'aria-label': tx('music.more') }, icon(ICONS.more));
    more.addEventListener('click', (e) => { e.stopPropagation(); menu(more, trackMenu(t, extraMenu)); });
    const sub = [t.artist || tx('music.unknown_artist'), t.album].filter(Boolean).join(' · ');
    const row = el('div', { class: 'row' + (playing ? ' playing' : ''), role: 'button', tabindex: '0', 'data-id': t.id },
      coverEl(t.cover),
      el('div', { class: 'meta' }, el('div', { class: 'title', text: t.title || tx('music.untitled') }), el('div', { class: 'sub', text: sub })),
      el('span', { class: 'time', text: fmtTime(t.duration) }),
      more);
    row.addEventListener('click', onPlay);
    row.addEventListener('keydown', (e) => { if (e.key === 'Enter') onPlay(); });
    row.addEventListener('contextmenu', (e) => { e.preventDefault(); menu(more, trackMenu(t, extraMenu)); });
    return row;
  }

  function trackMenu(t, extra) {
    const items = [
      { label: tx('music.play_next'), icon: ICONS.play, run: () => playNext(t.id) },
      { label: tx('music.add_to_playlist'), icon: ICONS.plus, run: () => addToPlaylist([t.id]) },
      '-',
      { label: tx('music.show_in_folder'), icon: ICONS.folder, run: () => send('music:reveal:' + t.id) },
    ];
    if (t.source === 'archive' && t.item) {
      items.push({ label: tx('music.license_label', { name: licenseName(null, t.license) }), icon: ICONS.check, run: () => window.open('https://archive.org/details/' + encodeURIComponent(t.item), '_blank', 'noopener') });
    }
    if (extra) items.push('-', ...extra);
    items.push('-',
      { label: tx('music.remove_from_library'), icon: ICONS.x, run: () => send('music:remove:' + JSON.stringify({ ids: [t.id], trash: false })) },
      { label: tx('music.move_to_recycle_bin'), icon: ICONS.trash, danger: true, run: () => confirmTrash([t.id]) });
    return items;
  }

  function confirmTrash(ids) {
    const n = ids.length;
    dialog(tx('music.trash.title', { count: n }),
      el('p', { class: 'muted', text: tx('music.trash.text', { count: n }) }),
      [{ label: tx('common.cancel') }, { label: tx('music.move_to_recycle_bin'), primary: true, run: () => send('music:remove:' + JSON.stringify({ ids, trash: true })) }]);
  }

  let rafPending = false;
  function paintLibrary() {
    rafPending = false;
    const h = rowHeight();
    libList.style.height = view.length * h + 'px';
    const top = Math.max(0, libScroll.scrollTop - libList.offsetTop);
    const first = Math.max(0, Math.floor(top / h) - 6);
    const last = Math.min(view.length, first + Math.ceil(libScroll.clientHeight / h) + 12);
    libWindow.style.transform = `translateY(${first * h}px)`;
    const rows = [];
    for (let i = first; i < last; i++) {
      const t = view[i];
      rows.push(trackRow(t, () => playList(view.map((x) => x.id), i)));
    }
    libWindow.replaceChildren(...rows);
  }
  libScroll.addEventListener('scroll', () => { if (!rafPending) { rafPending = true; requestAnimationFrame(paintLibrary); } });
  new ResizeObserver(() => { if (state.tab === 'library') paintLibrary(); }).observe(libScroll);

  function renderLibrary() {
    computeView();
    const empty = state.tracks.length === 0;
    $('library-empty').hidden = !empty;
    $('filter-empty').hidden = empty || view.length > 0;
    paintLibrary();
    const folders = $('folders');
    folders.hidden = state.folders.length === 0;
    const total = state.tracks.reduce((s, t) => s + (t.size || 0), 0);
    $('folders-summary').textContent = [
      tx('music.songs', { count: state.tracks.length }), fmtSize(total), tx('music.folders', { count: state.folders.length }),
    ].join(' · ');
    $('folders-list').replaceChildren(...state.folders.map((f) => {
      const remove = el('button', { class: 'btn ghost icon', type: 'button', title: tx('music.folder.remove_tip'), 'aria-label': tx('music.folder.remove_tip') }, icon(ICONS.x));
      remove.addEventListener('click', () => dialog(tx('music.folder.remove_title'),
        el('p', { class: 'muted' }, el('strong', { text: f }), el('br'), tx('music.folder.remove_text')),
        [{ label: tx('common.cancel') }, { label: tx('music.folder.remove'), primary: true, run: () => send('music:folder-remove:' + f) }]));
      return el('li', {}, icon(ICONS.folder), el('span', { class: 'path', text: f, title: f }), remove);
    }));
  }
  $('filter').addEventListener('input', () => { libScroll.scrollTop = 0; renderLibrary(); });
  $('sort').addEventListener('change', renderLibrary);
  for (const id of ['add-folder', 'empty-add']) $(id).addEventListener('click', () => send('music:pick-folder'));
  $('rescan').addEventListener('click', () => send('music:rescan'));
  $('empty-download').addEventListener('click', () => showTab('download'));
  $('shuffle-all').addEventListener('click', () => {
    if (!state.tracks.length) return;
    setShuffle(true);
    playList(view.map((t) => t.id), Math.floor(Math.random() * view.length));
  });

  // --------------------------------------------------------------------------
  // Playlists
  // --------------------------------------------------------------------------
  function playlistDuration(p) {
    return p.tracks.reduce((s, id) => s + ((state.byId.get(id) || {}).duration || 0), 0);
  }

  function renderPlaylists() {
    const body = $('playlists-body');
    const nodes = [];
    const open = state.playlists.find((p) => p.id === state.openPlaylist);
    if (open) {
      nodes.push(...playlistDetail(open));
    } else {
      const max = playlistMax();
      const room = canAddPlaylist();
      const create = el('button', { class: 'btn primary', type: 'button', disabled: !room,
        title: room ? tx('music.playlist.create_tip') : limitText() }, icon(ICONS.plus), tx('music.playlist.new'));
      create.addEventListener('click', () => newPlaylist([]));
      // "2 of 5 playlists · Free plan", with the number in bold.
      const count = state.playlists.length;
      const quotaText = max === null
        ? tx('music.playlist.quota_unlimited', { count })
        : tx('music.playlist.quota', { count, max, plan: planName(state.plan.plan) });
      const quota = el('span', { class: 'quota' }, ...boldNumbers(quotaText));
      const more = room || max === null ? null : (() => {
        const b = el('button', { class: 'link-btn', type: 'button', text: tx('music.playlist.more') });
        b.addEventListener('click', () => showTab('plan'));
        return b;
      })();
      nodes.push(el('div', { class: 'toolbar', style: 'padding:6px 0 10px' }, create, quota, more));
      if (!state.playlists.length) {
        nodes.push(el('p', { class: 'empty', text: tx('music.playlist.none') }));
      }
      for (const p of state.playlists) {
        const row = el('div', { class: 'playlist-row', role: 'button', tabindex: '0' },
          el('div', { class: 'pl-art' }, icon(ICONS.list)),
          el('div', { class: 'meta' }, el('div', { class: 'title', text: p.name }),
            el('div', { class: 'sub', text: [tx('music.songs', { count: p.tracks.length }), fmtTime(playlistDuration(p)), p.origin ? tx('music.playlist.downloaded_album') : null].filter(Boolean).join(' · ') })),
          el('span', { class: 'time' }));
        const play = el('button', { class: 'ctl', type: 'button', title: tx('music.play'), 'aria-label': tx('music.play') }, icon(ICONS.play, true));
        play.addEventListener('click', (e) => { e.stopPropagation(); playList(p.tracks.filter((id) => state.byId.has(id)), 0); });
        row.lastChild.replaceWith(play);
        row.addEventListener('click', () => { state.openPlaylist = p.id; renderPlaylists(); });
        row.addEventListener('keydown', (e) => { if (e.key === 'Enter') { state.openPlaylist = p.id; renderPlaylists(); } });
        nodes.push(row);
      }
    }
    body.replaceChildren(...nodes);
  }

  function savePlaylist(p) {
    send('music:playlist-save:' + JSON.stringify({ id: p.id || null, name: p.name, tracks: p.tracks }));
  }

  function playlistDetail(p) {
    // Playlists that already exist can always be edited, even when there are
    // more than the current plan allows.
    const editable = true;
    const back = el('button', { class: 'btn ghost icon', type: 'button', title: tx('music.back_to_list'), 'aria-label': tx('music.back_to_list') }, icon(ICONS.back));
    back.addEventListener('click', () => { state.openPlaylist = null; renderPlaylists(); });
    const name = el('input', { type: 'text', value: p.name, maxlength: '100', 'aria-label': tx('music.playlist.name'), disabled: !editable });
    name.addEventListener('change', () => { const v = name.value.trim(); if (v && v !== p.name) savePlaylist({ ...p, name: v }); });
    const play = el('button', { class: 'btn primary', type: 'button' }, icon(ICONS.play, true), tx('music.play'));
    const ids = p.tracks.filter((id) => state.byId.has(id));
    play.addEventListener('click', () => playList(ids, 0));
    const shuffle = el('button', { class: 'btn', type: 'button', text: tx('music.shuffle') });
    shuffle.addEventListener('click', () => { setShuffle(true); playList(ids, Math.floor(Math.random() * ids.length)); });
    const del = el('button', { class: 'btn ghost danger', type: 'button', text: tx('music.playlist.delete') });
    del.addEventListener('click', () => dialog(tx('music.playlist.delete_title'), el('p', { class: 'muted', text: tx('music.playlist.delete_text') }),
      [{ label: tx('common.cancel') }, { label: tx('music.playlist.delete_confirm'), primary: true, run: () => { send('music:playlist-delete:' + p.id); state.openPlaylist = null; } }]));
    const head = el('div', { class: 'pl-head' }, back, name, play, shuffle, del);
    const rows = ids.map((id, i) => {
      const t = state.byId.get(id);
      const extra = editable ? [
        { label: tx('music.move_up'), icon: ICONS.up, run: () => { if (i > 0) { const n = ids.slice(); [n[i - 1], n[i]] = [n[i], n[i - 1]]; savePlaylist({ ...p, tracks: n }); } } },
        { label: tx('music.remove_from_playlist'), icon: ICONS.x, run: () => savePlaylist({ ...p, tracks: ids.filter((_, j) => j !== i) }) },
      ] : null;
      return trackRow(t, () => playList(ids, i), extra);
    });
    if (!rows.length) rows.push(el('p', { class: 'empty', text: tx('music.playlist.empty') }));
    return [head, el('div', { class: 'card', style: 'padding:0;overflow:hidden' }, rows)];
  }

  function newPlaylist(tracks) {
    if (!canAddPlaylist()) { notice([limitMessage()]); return; }
    const input = el('input', { type: 'text', maxlength: '100', placeholder: tx('music.playlist.name'), 'aria-label': tx('music.playlist.name') });
    const ok = () => { const v = input.value.trim(); if (!v) return false; send('music:playlist-save:' + JSON.stringify({ id: null, name: v, tracks })); toast(tx('music.playlist.created', { name: v })); };
    const d = dialog(tx('music.playlist.new'), input, [{ label: tx('common.cancel') }, { label: tx('music.playlist.create'), primary: true, run: ok }]);
    input.addEventListener('keydown', (e) => { if (e.key === 'Enter' && ok() !== false) d.remove(); });
  }

  function addToPlaylist(ids) {
    const choices = el('div', { class: 'choices' });
    let d;
    const room = canAddPlaylist();
    const fresh = el('button', { class: 'btn', type: 'button', disabled: !room }, icon(ICONS.plus), tx('music.playlist.new_ellipsis'));
    fresh.addEventListener('click', () => { d.remove(); newPlaylist(ids); });
    choices.append(fresh);
    if (!room) choices.append(el('p', { class: 'muted small', style: 'margin:0', text: limitText() }));
    for (const p of state.playlists) {
      const b = el('button', { class: 'btn ghost', type: 'button', style: 'justify-content:flex-start', text: p.name });
      b.addEventListener('click', () => {
        savePlaylist({ ...p, tracks: p.tracks.concat(ids.filter((id) => !p.tracks.includes(id))) });
        toast(tx('music.playlist.added', { name: p.name }));
        d.remove();
      });
      choices.append(b);
    }
    d = dialog(tx('music.add_to_playlist_title'), choices, [{ label: tx('common.cancel') }]);
  }

  // --------------------------------------------------------------------------
  // Download (Internet Archive)
  // --------------------------------------------------------------------------
  $('search-form').addEventListener('submit', (e) => {
    e.preventDefault();
    const q = $('search').value.trim();
    if (!q) return;
    state.item = null;
    state.search = { query: q, page: 1, loading: true, hits: [], total: 0 };
    renderDownload();
    send('music:search:' + JSON.stringify({ q, page: 1 }));
  });
  $('quality').addEventListener('change', () => {
    send('music:quality:' + $('quality').value);
    if (state.item) { state.itemLoading = state.item.id; send('music:item:' + state.item.id); }
  });

  function licenseNote() {
    return el('div', { class: 'note' }, ...boldName(tx('music.download.note'), 'Internet Archive'));
  }

  function renderDownload() {
    const body = $('download-body');
    $('quality').value = state.quality;
    const nodes = [];
    if (state.itemLoading) {
      nodes.push(el('p', { class: 'muted', text: tx('music.album.opening') }));
    } else if (state.item) {
      nodes.push(...albumView(state.item));
    } else if (state.search) {
      const s = state.search;
      if (s.loading) nodes.push(el('p', { class: 'muted', text: tx('music.search.searching', { query: s.query }) }));
      else if (s.error) nodes.push(el('div', { class: 'note warn', text: tx('music.search.failed', { error: tm(s.error) }) }));
      else if (!s.hits.length) nodes.push(el('p', { class: 'empty', text: tx('music.search.none', { query: s.query }) }));
      else {
        nodes.push(el('p', { class: 'muted small', text: tx('music.search.found', { count: s.total, query: s.query }) }));
        for (const hit of s.hits) {
          const img = el('img', { alt: '', loading: 'lazy', src: archiveThumb(hit.id) });
          img.addEventListener('error', () => { img.style.visibility = 'hidden'; });
          const row = el('div', { class: 'hit', role: 'button', tabindex: '0' }, img,
            el('div', { class: 'meta' }, el('div', { class: 'title', text: hit.title || hit.id }),
              el('div', { class: 'sub', text: [hit.creator, hit.year].filter(Boolean).join(' · ') })),
            el('span', { class: 'badge', text: licenseName(hit.license, hit.licenseLabel) }));
          const open = () => { state.itemLoading = hit.id; renderDownload(); send('music:item:' + hit.id); };
          row.addEventListener('click', open);
          row.addEventListener('keydown', (e) => { if (e.key === 'Enter') open(); });
          nodes.push(row);
        }
        const pages = Math.ceil(s.total / 30);
        if (pages > 1) {
          const prev = el('button', { class: 'btn', type: 'button', text: tx('music.page.previous'), disabled: s.page <= 1 });
          const next = el('button', { class: 'btn', type: 'button', text: tx('music.page.next'), disabled: s.page >= Math.min(pages, 100) });
          const go = (p) => { state.search = { ...s, page: p, loading: true }; renderDownload(); send('music:search:' + JSON.stringify({ q: s.query, page: p })); };
          prev.addEventListener('click', () => go(s.page - 1));
          next.addEventListener('click', () => go(s.page + 1));
          nodes.push(el('div', { class: 'pager' }, prev, el('span', { class: 'muted small', text: tx('music.page.of', { page: s.page, pages: Math.min(pages, 100) }) }), next));
        }
      }
    } else {
      nodes.push(licenseNote());
      nodes.push(el('div', { class: 'empty' },
        el('div', { class: 'art' }, icon(ICONS.down)),
        el('h2', { text: tx('music.download.title') }),
        el('p', { text: tx('music.download.text') })));
    }
    body.replaceChildren(...nodes);
    renderJobs();
  }

  function trackStatus(t, item) {
    if (t.existing) return el('span', { class: 'badge ok', text: tx('music.have_it'), title: tm(t.existing.message) });
    if (t.queued) return el('span', { class: 'state', text: tx('music.queued_ellipsis') });
    // Without a download plan there is no button: only the (free) preview.
    if (!can('download')) return el('span');
    const b = el('button', { class: 'btn', type: 'button', title: tx('music.download_song'), 'aria-label': tx('music.download_song') }, icon(ICONS.down));
    b.addEventListener('click', () => send('music:download:' + JSON.stringify({ item: item.id, files: [t.file], playlist: false })));
    return b;
  }

  function albumView(item) {
    const back = el('button', { class: 'btn ghost', type: 'button' }, icon(ICONS.back), tx('music.album.results'));
    back.addEventListener('click', () => { state.item = null; stopPreview(); renderDownload(); });
    const thumb = el('img', { class: 'thumb', alt: '', src: item.thumbnail });
    const link = el('a', { href: item.details, target: '_blank', rel: 'noopener noreferrer', class: 'small', text: tx('music.album.on_archive') });
    const head = el('div', { class: 'album-head' }, thumb,
      el('div', { class: 'meta' },
        el('h2', { text: item.title || item.id }),
        el('div', { class: 'sub', text: item.creator || '' }),
        el('div', { class: 'small' }, el('span', { class: 'badge', text: licenseName(item.license, item.licenseLabel) }), ' ',
          el('span', { class: 'muted', text: tx('music.license.terms.' + (LICENSE_KEYS[item.license] || 'by')) }), ' ', link)));
    const missing = item.tracks.filter((t) => !t.existing && !t.queued);
    const total = missing.reduce((s, t) => s + (t.size || 0), 0);
    // Will it become a playlist? If the album's already exists or there is room.
    const asPlaylist = canAddPlaylist() || state.playlists.some((p) => p.origin === item.id);
    let all;
    if (can('download')) {
      const label = !missing.length ? tx('music.album.have_all')
        : tx(asPlaylist ? 'music.album.download_as_playlist' : 'music.album.download', { count: missing.length, size: fmtSize(total) });
      all = el('button', { class: 'btn primary', type: 'button', disabled: !missing.length,
        title: asPlaylist ? '' : tx('music.album.no_playlist_tip') }, icon(ICONS.down), label);
      all.addEventListener('click', () => send('music:download:' + JSON.stringify({ item: item.id, files: item.tracks.map((t) => t.file), playlist: true })));
    } else {
      const plans = el('button', { class: 'link-btn', type: 'button', text: tx('music.see_plans') });
      plans.addEventListener('click', () => showTab('plan'));
      all = el('span', { class: 'muted small', style: 'align-self:center' }, tx('music.album.listen_free'), ' · ', plans);
    }
    const have = item.tracks.length - missing.length;
    const actions = el('div', { class: 'album-actions' }, back, all,
      have ? el('span', { class: 'muted small', style: 'align-self:center', text: tx('music.album.already_have', { count: have }) }) : null);
    const list = item.tracks.map((t, i) => {
      const prev = el('button', { class: 'preview', type: 'button', title: tx('music.preview_tip'), 'aria-label': tx('music.preview_tip') },
        icon(player.preview && player.preview.file === t.file && !$('audio').paused ? ICONS.pause : ICONS.play, true));
      prev.addEventListener('click', () => togglePreview(item, t));
      return el('div', { class: 'track' }, prev,
        el('div', { class: 'meta' }, el('div', { class: 'title', text: t.title }), el('div', { class: 'sub', text: `${t.artist}${t.duration ? ' · ' + fmtTime(t.duration) : ''} · ${(t.format || '').toUpperCase()} · ${fmtSize(t.size)}` })),
        el('span', { class: 'num', text: t.trackNo || i + 1 }),
        trackStatus(t, item));
    });
    if (!list.length) list.push(el('p', { class: 'muted', text: tx('music.album.no_audio') }));
    return [head, actions, el('div', {}, list)];
  }

  function renderJobs() {
    const jobs = state.jobs;
    const active = jobs.filter((j) => ['queued', 'downloading', 'processing'].includes(j.state));
    $('jobs-count').textContent = active.length ? String(active.length) : '';
    $('jobs').hidden = jobs.length === 0;
    if (!jobs.length) return;
    const saved = jobs.filter((j) => j.state === 'done').length;
    const skipped = jobs.filter((j) => j.state === 'skipped').length;
    $('jobs-title').textContent = active.length
      ? tx('music.jobs.downloading', { count: active.length })
      : skipped ? tx('music.jobs.summary_skipped', { count: saved, skipped }) : tx('music.jobs.summary', { count: saved });
    const labels = {
      queued: tx('music.job.queued'), downloading: '', processing: tx('music.job.processing'), done: tx('music.job.done'),
      skipped: '', failed: tx('music.job.failed'), cancelled: tx('music.job.cancelled'),
    };
    const rows = jobs.slice().reverse().slice(0, 120).map((j) => {
      const pct = j.size ? Math.min(100, Math.round((j.received / j.size) * 100)) : 0;
      let label = labels[j.state] ?? j.state;
      if (j.state === 'downloading') label = j.size ? fmtPercent(pct) : fmtSize(j.received);
      if (j.state === 'skipped') label = j.message ? tm(j.message) : tx('music.job.had_it');
      if (j.state === 'failed' && j.message) label = tx('music.job.failed_because', { error: tm(j.message) });
      const cancel = ['queued', 'downloading'].includes(j.state)
        ? (() => { const b = el('button', { class: 'more', type: 'button', title: tx('common.cancel'), 'aria-label': tx('common.cancel') }, icon(ICONS.x)); b.addEventListener('click', () => send('music:cancel:' + j.id)); return b; })()
        : el('span');
      return el('div', { class: 'job ' + j.state },
        el('div', { class: 'meta' }, el('div', { class: 'title', text: j.title }), el('div', { class: 'sub', text: j.artist })),
        el('span', { class: 'label', text: label }), cancel,
        j.state === 'downloading' ? el('div', { class: 'progress' }, el('span', { style: `width:${pct}%` })) : null);
    });
    $('jobs-list').replaceChildren(...rows);
  }
  $('jobs-toggle').addEventListener('click', () => {
    const collapsed = $('jobs').classList.toggle('collapsed');
    $('jobs-toggle').setAttribute('aria-expanded', String(!collapsed));
  });
  // In short windows the list starts folded (the summary stays in sight).
  if (innerHeight < 420) $('jobs').classList.add('collapsed');
  $('jobs-cancel').addEventListener('click', () => send('music:cancel:all'));
  $('jobs-clear').addEventListener('click', () => send('music:clear-jobs'));
  $('jobs-folder').addEventListener('click', () => send('music:open-folder'));

  // --------------------------------------------------------------------------
  // Duplicates
  // --------------------------------------------------------------------------
  $('dupes-run').addEventListener('click', () => { state.dupes = { running: true, done: 0, total: 0, groups: [] }; renderDupes(); send('music:dupes'); });
  const reasonName = (reason) => tx('music.reason.' + String(reason).replace(/-/g, '_'));

  function renderDupes() {
    const body = $('dupes-body');
    const d = state.dupes;
    $('dupes-run').disabled = !!(d && d.running);
    if (!d) {
      $('dupes-status').textContent = tx('music.dupes.how');
      body.replaceChildren(el('p', { class: 'muted', text: tx('music.dupes.intro') }));
      return;
    }
    if (d.running) {
      $('dupes-status').textContent = d.total ? tx('music.dupes.analysing', { done: d.done, count: d.total }) : tx('music.dupes.searching');
      body.replaceChildren();
      return;
    }
    const groups = (d.groups || []).filter((g) => g.tracks.filter((id) => state.byId.has(id)).length > 1);
    $('dupes-status').textContent = groups.length
      ? tx('music.dupes.found', { count: groups.length, size: fmtSize(groups.reduce((sum, g) => sum + g.wasted, 0)) })
      : tx('music.dupes.none');
    body.replaceChildren(...groups.map((g, gi) => {
      const ids = g.tracks.filter((id) => state.byId.has(id));
      let keep = ids[0];
      const rows = ids.map((id, i) => {
        const t = state.byId.get(id);
        const radio = el('input', { type: 'radio', name: 'keep-' + gi, checked: i === 0, 'aria-label': tx('music.dupes.keep') });
        radio.addEventListener('change', () => { keep = id; });
        const info = [t.format.toUpperCase(), t.bitrate ? tx('music.kbps', { value: t.bitrate }) : null, fmtSize(t.size), fmtTime(t.duration)].filter(Boolean).join(' · ');
        const row = el('label', { class: 'dupe' }, radio,
          el('div', { class: 'meta' }, el('div', { class: 'title', text: `${t.title}${t.artist ? ' — ' + t.artist : ''}` }), el('div', { class: 'sub', text: info }), el('div', { class: 'path', text: t.path, title: t.path })),
          i === 0 ? el('span', { class: 'badge ok', text: tx('music.dupes.best') }) : el('span'));
        return row;
      });
      const remove = el('button', { class: 'btn', type: 'button' }, icon(ICONS.trash), tx('music.dupes.trash_others'));
      remove.addEventListener('click', () => confirmTrash(ids.filter((id) => id !== keep)));
      const ignore = el('button', { class: 'btn ghost', type: 'button', text: tx('music.dupes.not_same') });
      ignore.addEventListener('click', () => { send('music:dupes-ignore:' + JSON.stringify(ids)); d.groups = d.groups.filter((x) => x !== g); renderDupes(); });
      return el('div', { class: 'group' },
        el('div', { class: 'head' }, el('span', { class: 'badge', text: reasonName(g.reason) }),
          el('span', { class: 'muted small grow', text: tx('music.dupes.copies', { count: ids.length, size: fmtSize(g.wasted) }) }), ignore, remove),
        rows);
    }));
  }

  // --------------------------------------------------------------------------
  // Plan and license
  // --------------------------------------------------------------------------
  // Prices in dollars, written the way each language writes them ("$2",
  // "2 US$", "2 $"…).
  const money = (amount) => {
    try { return new Intl.NumberFormat(I18N.lang, { style: 'currency', currency: 'USD', maximumFractionDigits: 0 }).format(amount); } catch (_) { return amount + ' USD'; }
  };
  const LICENSE_STATUS = ['active', 'inactive', 'expired', 'disabled', 'invalid'];
  function renderPlan() {
    const p = state.plan;
    const body = $('plan-body');
    const nodes = [];
    if (p.dev) nodes.push(el('div', { class: 'note dev', text: tx('music.plan.dev_build') }));
    else if (!p.configured) nodes.push(el('div', { class: 'note warn', text: tx('music.plan.no_store') }));

    const card = (id, price, unit, features, buy) => {
      const current = p.plan === id;
      const button = buy ? el('button', { class: 'btn ' + (current ? '' : 'primary'), type: 'button', disabled: current || !buy.enabled, text: current ? tx('music.plan.yours') : buy.label }) : null;
      if (button && !current) button.addEventListener('click', buy.run);
      return el('div', { class: 'plan' + (current ? ' current' : '') },
        el('h3', { text: planName(id) }),
        el('div', { class: 'price' }, price, unit ? el('small', { text: ' ' + unit }) : null),
        el('ul', {}, features.map((f) => el('li', { text: f }))),
        button || el('span', { class: 'muted small', text: current ? tx('music.plan.yours') : '' }));
    };
    nodes.push(el('div', { class: 'plans' },
      card('free', money(0), '', [tx('music.plan.free.library'), tx('music.plan.free.import'), tx('music.plan.free.listen'), tx('music.plan.playlists', { count: 2 })]),
      card('downloads', money(2), tx('music.plan.per_month'), [tx('music.plan.downloads.everything_free'), tx('music.plan.downloads.download'), tx('music.plan.downloads.no_repeats'), tx('music.plan.playlists', { count: 5 })],
        { label: tx('music.plan.subscribe'), enabled: p.canBuyDownloads, run: () => send('music:buy:downloads') }),
      card('lifetime', money(10), tx('music.plan.one_time'), [tx('music.plan.lifetime.forever'), tx('music.plan.lifetime.unlimited'), tx('music.plan.lifetime.offline')],
        { label: tx('music.plan.buy'), enabled: p.canBuyLifetime, run: () => send('music:buy:lifetime') })));

    const licensed = !!p.key;
    const form = el('form', { class: 'license-form', autocomplete: 'off' });
    const input = el('input', { type: 'text', placeholder: 'XXXXXXXX-XXXX-XXXX-XXXX-XXXXXXXXXXXX', 'aria-label': tx('music.license.key'), spellcheck: 'false', maxlength: '200', disabled: p.busy || !p.configured });
    const activate = el('button', { class: 'btn primary', type: 'submit', text: p.busy ? tx('music.license.checking') : tx('music.license.activate'), disabled: p.busy || !p.configured });
    form.append(input, activate);
    form.addEventListener('submit', (e) => { e.preventDefault(); const k = input.value.trim(); if (k) { send('music:license-activate:' + k); input.value = ''; } });
    const licenseCard = el('div', { class: 'card' },
      el('h3', { text: licensed ? tx('music.license.title', { plan: planName(p.plan) }) : tx('music.license.title_none') }),
      el('p', { class: 'muted small', text: licensed ? tx('music.license.other_key') : tx('music.license.paste') }),
      form);
    if (licensed) {
      const facts = el('dl', { class: 'facts' });
      const add = (k, v) => { if (v) facts.append(el('dt', { text: k }), el('dd', { text: v })); };
      add(tx('music.license.product'), p.product);
      add(tx('music.license.email'), p.email);
      add(tx('music.license.key'), p.key);
      add(tx('music.license.status'), LICENSE_STATUS.includes(p.status) ? tx('music.license.status.' + p.status) : p.status);
      if (p.expiresAt) add(tx('music.license.renews'), fmt.date.format(new Date(p.expiresAt)));
      if (p.validatedAt) add(tx('music.license.checked'), fmt.dateTime.format(new Date(p.validatedAt * 1000)));
      const refresh = el('button', { class: 'btn', type: 'button', text: tx('music.license.check_now'), disabled: p.busy });
      refresh.addEventListener('click', () => send('music:license-refresh'));
      const deact = el('button', { class: 'btn ghost danger', type: 'button', text: tx('music.license.deactivate'), disabled: p.busy });
      deact.addEventListener('click', () => dialog(tx('music.license.deactivate_title'), el('p', { class: 'muted', text: tx('music.license.deactivate_text') }),
        [{ label: tx('common.cancel') }, { label: tx('music.license.deactivate_confirm'), primary: true, run: () => send('music:license-deactivate') }]));
      const actions = el('div', { class: 'album-actions' }, refresh, deact);
      if (p.canManage && p.plan === 'downloads') {
        const manage = el('button', { class: 'btn', type: 'button', text: tx('music.license.manage') });
        manage.addEventListener('click', () => send('music:manage'));
        actions.prepend(manage);
      }
      licenseCard.append(facts, actions);
    }
    if (p.message) licenseCard.append(el('p', { class: 'msg' + (p.error ? ' error' : ''), role: 'status', text: tm(p.message) }));
    nodes.push(licenseCard);
    nodes.push(el('p', { class: 'muted small', text: tx('music.plan.fair') }));
    nodes.push(el('p', { class: 'muted small', text: tx('music.plan.payments') }));
    body.replaceChildren(...nodes);
  }

  // --------------------------------------------------------------------------
  // Player
  // --------------------------------------------------------------------------
  const audio = $('audio');
  const prefs = (() => { try { return JSON.parse(localStorage.getItem('ytmp-music-player') || '{}'); } catch (_) { return {}; } })();
  function savePrefs() { try { localStorage.setItem('ytmp-music-player', JSON.stringify({ volume: audio.volume, shuffle: player.shuffle, repeat: player.repeat })); } catch (_) { /* no storage */ } }
  audio.volume = Number.isFinite(prefs.volume) ? Math.min(1, Math.max(0, prefs.volume)) : 0.8;
  $('volume').value = Math.round(audio.volume * 100);
  player.shuffle = !!prefs.shuffle;
  player.repeat = ['off', 'all', 'one'].includes(prefs.repeat) ? prefs.repeat : 'off';
  let order = [];   // play order (indices into the queue)

  function setShuffle(on) {
    player.shuffle = on;
    $('shuffle').classList.toggle('on', on);
    $('shuffle').setAttribute('aria-pressed', String(on));
    rebuildOrder();
    savePrefs();
  }
  function rebuildOrder() {
    const n = player.queue.length;
    order = [...Array(n).keys()];
    if (player.shuffle && n > 1) {
      for (let i = n - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [order[i], order[j]] = [order[j], order[i]]; }
      // The current one goes first.
      const at = order.indexOf(player.index);
      if (at > 0) { order.splice(at, 1); order.unshift(player.index); }
    }
  }
  function playList(ids, start) {
    if (!ids.length) return;
    player.queue = ids.slice();
    player.index = Math.max(0, Math.min(start, ids.length - 1));
    rebuildOrder();
    loadCurrent(true);
  }
  function playNext(id) {
    if (player.index < 0) { playList([id], 0); return; }
    player.queue.splice(player.index + 1, 0, id);
    rebuildOrder();
    toast(tx('music.plays_next'));
  }
  function stopPreview() {
    if (player.preview) { player.preview = null; audio.pause(); audio.removeAttribute('src'); audio.load(); updateNow(); }
  }
  function togglePreview(item, t) {
    if (player.preview && player.preview.file === t.file) {
      if (audio.paused) audio.play().catch(() => {}); else audio.pause();
      return;
    }
    player.preview = { item: item.id, file: t.file, title: t.title, artist: t.artist, thumb: item.thumbnail };
    audio.src = archiveFile(item.id, t.file);
    audio.play().catch(() => toast(tx('music.preview_failed')));
    updateNow();
  }
  function current() { return player.preview ? null : state.byId.get(player.queue[player.index]); }

  function loadCurrent(autoplay) {
    player.preview = null;
    const t = current();
    if (!t) { updateNow(); return; }
    if (!state.key) { toast(tx('music.not_ready')); return; }
    audio.src = mediaUrl(t.id);
    if (autoplay) audio.play().catch(() => {});
    updateNow();
    if (state.tab === 'library') paintLibrary();
  }
  function step(dir, auto) {
    if (player.preview) return;
    const n = player.queue.length;
    if (!n) return;
    if (auto && player.repeat === 'one') { audio.currentTime = 0; audio.play().catch(() => {}); return; }
    // "Previous" after 3 s: back to the start of the song.
    if (dir < 0 && audio.currentTime > 3) { audio.currentTime = 0; return; }
    const at = order.indexOf(player.index);
    let next = at + dir;
    if (next >= n) {
      if (player.repeat === 'off' && auto) { audio.pause(); audio.currentTime = 0; updateNow(); return; }
      if (player.shuffle) rebuildOrder();
      next = 0;
    }
    if (next < 0) next = player.repeat === 'off' ? 0 : n - 1;
    player.index = order[next];
    loadCurrent(true);
  }

  function updateNow() {
    const t = current();
    const p = player.preview;
    const coverBox = $('now-cover');
    if (p) {
      $('now-title').textContent = p.title;
      $('now-sub').replaceChildren(el('span', { class: 'preview-tag', text: tx('music.preview') + ' · ' }), p.artist || '');
      coverBox.replaceChildren(el('img', { class: 'cover', alt: '', src: p.thumb }));
    } else if (t) {
      $('now-title').textContent = t.title || tx('music.untitled');
      $('now-sub').textContent = [t.artist, t.album].filter(Boolean).join(' · ') || tx('music.unknown_artist');
      coverBox.replaceChildren(coverEl(t.cover));
    } else {
      $('now-title').textContent = tx('music.nothing_playing');
      $('now-sub').textContent = tx(state.tracks.length ? 'music.pick_a_song' : 'music.add_music_first');
      coverBox.replaceChildren(icon(ICONS.note));
    }
    const has = !!(t || p);
    for (const id of ['prev', 'next']) $(id).disabled = !t;
    $('play').disabled = !has;
    // Media Session: the taskbar, the tray and the media keys.
    if ('mediaSession' in navigator) {
      if (has && window.MediaMetadata) {
        const art = p ? p.thumb : (t.cover ? absolute(coverUrl(t.cover)) : '');
        navigator.mediaSession.metadata = new MediaMetadata({
          title: p ? p.title : (t.title || ''),
          artist: p ? (p.artist || '') : (t.artist || ''),
          album: p ? '' : (t.album || ''),
          artwork: art ? [{ src: art, sizes: '512x512' }] : [],
        });
      } else {
        navigator.mediaSession.metadata = null;
      }
    }
  }
  function updatePlayIcon() {
    const playing = !audio.paused && !audio.ended;
    const svg = $('play-icon');
    svg.replaceChildren();
    for (const d of [playing ? ICONS.pause : ICONS.play]) {
      const path = document.createElementNS(SVG, 'path');
      path.setAttribute('d', d);
      svg.append(path);
    }
    $('play').title = tx(playing ? 'music.pause' : 'music.play');
    $('play').setAttribute('aria-label', $('play').title);
    if ('mediaSession' in navigator) navigator.mediaSession.playbackState = playing ? 'playing' : 'paused';
    if (state.tab === 'download' && state.item) renderDownload();
  }

  let seeking = false;
  audio.addEventListener('timeupdate', () => {
    if (seeking) return;
    const d = audio.duration;
    $('pos').textContent = fmtTime(audio.currentTime);
    $('seek').value = Number.isFinite(d) && d > 0 ? Math.round((audio.currentTime / d) * 1000) : 0;
  });
  audio.addEventListener('durationchange', () => { $('dur').textContent = fmtTime(audio.duration); });
  audio.addEventListener('play', updatePlayIcon);
  audio.addEventListener('pause', updatePlayIcon);
  audio.addEventListener('ended', () => { if (player.preview) { updatePlayIcon(); return; } step(1, true); });
  audio.addEventListener('error', () => {
    if (!audio.getAttribute('src')) return;
    if (player.preview) { toast(tx('music.preview_failed')); stopPreview(); return; }
    const track = current();
    toast(track ? tx('music.play_failed', { title: track.title || tx('music.untitled') }) : tx('music.play_failed_unknown'));
    if (player.queue.length > 1) setTimeout(() => step(1, true), 600);
  });
  $('seek').addEventListener('input', () => {
    seeking = true;
    const d = audio.duration;
    if (Number.isFinite(d)) $('pos').textContent = fmtTime((Number($('seek').value) / 1000) * d);
  });
  $('seek').addEventListener('change', () => {
    const d = audio.duration;
    if (Number.isFinite(d)) audio.currentTime = (Number($('seek').value) / 1000) * d;
    seeking = false;
  });
  $('play').addEventListener('click', () => {
    if (!audio.getAttribute('src')) { if (player.queue.length) loadCurrent(true); return; }
    if (audio.paused) audio.play().catch(() => {}); else audio.pause();
  });
  $('prev').addEventListener('click', () => step(-1, false));
  $('next').addEventListener('click', () => step(1, false));
  $('shuffle').addEventListener('click', () => setShuffle(!player.shuffle));
  $('repeat').addEventListener('click', () => {
    player.repeat = { off: 'all', all: 'one', one: 'off' }[player.repeat];
    paintRepeat();
    savePrefs();
  });
  function paintRepeat() {
    const b = $('repeat');
    b.classList.toggle('on', player.repeat !== 'off');
    b.setAttribute('aria-pressed', String(player.repeat !== 'off'));
    b.title = tx('music.repeat.' + player.repeat);
    b.setAttribute('aria-label', b.title);
  }
  $('volume').addEventListener('input', () => { audio.volume = Number($('volume').value) / 100; audio.muted = false; savePrefs(); });
  $('mute').addEventListener('click', () => { audio.muted = !audio.muted; });
  audio.addEventListener('volumechange', () => {
    $('volume').value = audio.muted ? 0 : Math.round(audio.volume * 100);
    $('vol-wave').style.display = audio.muted || audio.volume === 0 ? 'none' : '';
  });

  if ('mediaSession' in navigator) {
    const set = (action, fn) => { try { navigator.mediaSession.setActionHandler(action, fn); } catch (_) { /* not supported */ } };
    set('play', () => audio.play().catch(() => {}));
    set('pause', () => audio.pause());
    set('nexttrack', () => step(1, false));
    set('previoustrack', () => step(-1, false));
    set('seekto', (d) => { if (Number.isFinite(d.seekTime)) audio.currentTime = d.seekTime; });
    set('seekforward', (d) => { audio.currentTime = Math.min(audio.duration || 0, audio.currentTime + (d.seekOffset || 10)); });
    set('seekbackward', (d) => { audio.currentTime = Math.max(0, audio.currentTime - (d.seekOffset || 10)); });
  }

  // Space: play/pause (outside text fields).
  window.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') closeMenu();
    if (e.target instanceof HTMLInputElement || e.target instanceof HTMLSelectElement || e.target instanceof HTMLTextAreaElement) return;
    if (e.code === 'Space' && !e.ctrlKey && !e.altKey && !e.metaKey && !e.repeat && !document.querySelector('.scrim')) {
      e.preventDefault();
      $('play').click();
    }
  });
  window.addEventListener('contextmenu', (e) => { if (!(e.target instanceof HTMLInputElement)) e.preventDefault(); });

  // --------------------------------------------------------------------------
  // Messages from the app
  // --------------------------------------------------------------------------
  window.addEventListener('ytmp:music', (e) => {
    const m = e.detail || {};
    switch (m.type) {
      case 'library': {
        state.tracks = Array.isArray(m.tracks) ? m.tracks : [];
        state.byId = new Map(state.tracks.map((t) => [t.id, t]));
        state.playlists = Array.isArray(m.playlists) ? m.playlists : [];
        state.folders = Array.isArray(m.folders) ? m.folders : [];
        state.quality = m.quality || 'compact';
        if (m.mediaKey) state.key = m.mediaKey;
        if (state.tab === 'library') renderLibrary();
        if (state.tab === 'playlists') renderPlaylists();
        if (state.tab === 'dupes') renderDupes();
        if (state.tab === 'download') $('quality').value = state.quality;
        if (player.index >= 0 && !current() && !player.preview) {
          // The song that was playing is gone (removed or sent to the Recycle Bin).
          player.queue = player.queue.filter((id) => state.byId.has(id));
          player.index = Math.min(player.index, player.queue.length - 1);
          rebuildOrder();
        }
        updateNow();
        break;
      }
      case 'scan': {
        const box = $('scan-status');
        box.hidden = !m.running;
        if (m.running) {
          state.scan = m;
          paintScan();
        } else if (m.messages) {
          state.scan = null;
          toast(tms(m.messages));
        }
        break;
      }
      case 'plan': {
        const previous = state.plan.message;
        state.plan = m;
        if (state.tab === 'plan') renderPlan();
        if (state.tab === 'download') renderDownload();
        if (state.tab === 'playlists') renderPlaylists();
        // A new message is shown once (outside the Plan tab).
        if (m.message && JSON.stringify(m.message) !== JSON.stringify(previous) && state.tab !== 'plan' && !m.busy) toast(tm(m.message));
        break;
      }
      case 'search':
        if (!state.search || state.search.query !== m.query) break;
        state.search = { query: m.query, page: m.page, total: m.total || 0, hits: m.hits || [], error: m.error || null };
        if (state.tab === 'download') renderDownload();
        break;
      case 'item':
        if (m.error) {
          if (state.itemLoading === m.id) { state.itemLoading = null; toast(tx('music.album.open_failed', { error: tm(m.error) })); }
        } else if (state.itemLoading === m.id || (state.item && state.item.id === m.id)) {
          state.itemLoading = null;
          state.item = m.item;
        }
        if (state.tab === 'download') renderDownload();
        break;
      case 'downloads':
        state.jobs = Array.isArray(m.jobs) ? m.jobs : [];
        if (state.tab === 'download') renderJobs(); else {
          const active = state.jobs.filter((j) => ['queued', 'downloading', 'processing'].includes(j.state)).length;
          $('jobs-count').textContent = active ? String(active) : '';
        }
        break;
      case 'dupes':
        state.dupes = Object.assign(state.dupes || {}, m);
        if (state.tab === 'dupes') renderDupes();
        break;
      case 'notice':
      case 'locked':
        notice(m.messages && m.messages.length ? m.messages : [{ key: 'music.limit.generic' }]);
        break;
      case 'toast':
        if (m.messages) toast(tms(m.messages));
        break;
      default:
        break;
    }
  });

  function paintScan() {
    const m = state.scan;
    if (!m) return;
    $('scan-text').textContent = m.total ? tx('music.scan.progress', { done: m.done, count: m.total }) : tx('music.scan.searching');
    $('scan-bar').style.width = m.total ? Math.round((m.done / m.total) * 100) + '%' : '8%';
  }

  // New language: every text again, in place (what plays, the open tab and
  // what was typed stay).
  window.addEventListener('ytmp:locale', (e) => {
    const d = e.detail;
    if (!d || !d.strings || d.lang === I18N.lang) return;
    I18N = { lang: d.lang, languages: d.languages || [], strings: d.strings };
    formatters();
    applyStatic();
    fitTabs();
    if (state.notice) notice(state.notice);
    paintScan();
    paintRepeat();
    updateNow();
    updatePlayIcon();
    showTab(state.tab);
  });

  setShuffle(player.shuffle);
  paintRepeat();
  updateNow();
  updatePlayIcon();
  renderLibrary();
  renderDupes();
  send('music:ready');
})();
</script>
</body>
</html>

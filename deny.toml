# cargo-deny: qué dependencias se aceptan. Lo comprueba CI (ci.yml).

[graph]
targets = [{ triple = "x86_64-pc-windows-msvc" }]

[advisories]
# Cualquier aviso de seguridad de RustSec hace fallar la comprobación.
version = 2
yanked = "deny"

[licenses]
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "ISC",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Zlib",
    "MPL-2.0",
    "CC0-1.0",
]
confidence-threshold = 0.9

[licenses.private]
# La propia app no se publica en crates.io (publish = false).
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
# Solo crates.io: nada de dependencias de repositorios git sueltos.
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]

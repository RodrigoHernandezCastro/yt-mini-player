# cargo-deny: which dependencies are accepted. CI checks it (ci.yml).

[graph]
targets = [{ triple = "x86_64-pc-windows-msvc" }]

[advisories]
# Any RustSec security advisory fails the check.
version = 2
yanked = "deny"
ignore = [
    # `paste` (used by lofty) is a macro that only runs at build time; it is
    # "unmaintained" but has no known vulnerability.
    { id = "RUSTSEC-2024-0436", reason = "build-time macro with no code in the executable; no vulnerabilities" },
]

[licenses]
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "ISC",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Zlib",
    "MPL-2.0",
    "CC0-1.0",
]
confidence-threshold = 0.9

[licenses.private]
# The app itself is not published on crates.io (publish = false).
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
# Only crates.io: no dependencies from loose git repositories.
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]

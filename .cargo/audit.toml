# cargo audit: advisories that do not affect the Windows executable.
[advisories]
ignore = [
    # proc-macro-error (unmaintained) and glib (unsound): only pulled in when
    # building for Linux (gtk, through wry/tao). The .exe does not include them.
    "RUSTSEC-2024-0370",
    "RUSTSEC-2024-0429",
    # paste (unmaintained): a build-time macro lofty uses; none of its code is
    # in the executable and it has no known vulnerabilities.
    "RUSTSEC-2024-0436",
]

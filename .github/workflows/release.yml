# Published release: built on GitHub (not on anyone's PC), with the SHA-256
# fingerprints and a signed provenance attestation (Sigstore) that proves
# which commit and workflow produced each file:
#   gh attestation verify YT-Mini-Player-<version>-win64.zip --repo <owner>/<repo>
#
# Two jobs. `build` compiles and tests with read-only rights: the build code
# of every dependency (and cargo-audit) runs there, where nothing can be
# signed or published. `release` builds nothing: it takes the two programs,
# signs them (Azure, through OIDC), attests and publishes.
#
# Actions are pinned to a commit (a tag can be moved to other code);
# Dependabot keeps the pins up to date.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The zip is named after Cargo.toml's version (tools/package.ps1) and
      # the release after the tag: they must agree, or a release goes out
      # under the wrong number. Checked first, before anything is built.
      - name: Tag matches Cargo.toml
        shell: pwsh
        run: |
          $version = (Select-String -Path Cargo.toml -Pattern '^version\s*=\s*"(.+)"').Matches[0].Groups[1].Value
          if ($env:GITHUB_REF_NAME -cne "v$version") {
            "::error file=Cargo.toml::The tag is $env:GITHUB_REF_NAME but Cargo.toml says ${version}. Tag v${version}, or change the version, and push again."
            exit 1
          }
          "Releasing $version"
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      - name: Tests
        run: cargo test --locked
      - name: Dependency audit
        run: |
          cargo install cargo-audit --locked
          cargo audit --deny warnings
      - name: Build (normal + maximum overlay)
        shell: pwsh
        # Lemon Squeezy store and the watch together relay (repository
        # variables, not secrets: ids, checkout links and the relay address
        # are public). Without them, the paid plans are locked in the app.
        env:
          YTMP_LS_STORE_ID: ${{ vars.YTMP_LS_STORE_ID }}
          YTMP_LS_DOWNLOADS_PRODUCTS: ${{ vars.YTMP_LS_DOWNLOADS_PRODUCTS }}
          YTMP_LS_LIFETIME_PRODUCTS: ${{ vars.YTMP_LS_LIFETIME_PRODUCTS }}
          YTMP_LS_DOWNLOADS_CHECKOUT: ${{ vars.YTMP_LS_DOWNLOADS_CHECKOUT }}
          YTMP_LS_LIFETIME_CHECKOUT: ${{ vars.YTMP_LS_LIFETIME_CHECKOUT }}
          YTMP_LS_PORTAL: ${{ vars.YTMP_LS_PORTAL }}
          # Watch together relay (server/together-relay), e.g.
          # wss://ytmp-together.<subdomain>.workers.dev. Without it, the app
          # asks for the address the first time.
          YTMP_TOGETHER_RELAY: ${{ vars.YTMP_TOGETHER_RELAY }}
        run: ./tools/package.ps1 -BuildOnly
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: programs
          path: |
            target/release/yt-mini-player.exe
            target/uia/release/yt-mini-player.exe
          if-no-files-found: error
          retention-days: 1

  release:
    needs: build
    runs-on: windows-latest
    permissions:
      contents: write      # upload the files to the release
      id-token: write      # sign in to Azure for signing, sign the attestation (OIDC)
      attestations: write
    steps:
      # Only the repository's scripts and the installer's files: nothing is
      # built here.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Version
        shell: pwsh
        run: |
          $version = (Select-String -Path Cargo.toml -Pattern '^version\s*=\s*"(.+)"').Matches[0].Groups[1].Value
          "YTMP_VERSION=$version" >> $env:GITHUB_ENV
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: programs
          path: target
      # Authenticode with Azure Artifact Signing, when the repository has it
      # set up (the variables below; docs/SIGNING.md). Without them the
      # release is built unsigned, as before, and the log says so.
      - name: Sign in to Azure (for signing)
        if: ${{ vars.AZURE_SIGNING_ENDPOINT != '' }}
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Signing client
        if: ${{ vars.AZURE_SIGNING_ENDPOINT != '' }}
        shell: pwsh
        env:
          ENDPOINT: ${{ vars.AZURE_SIGNING_ENDPOINT }}
          ACCOUNT: ${{ vars.AZURE_SIGNING_ACCOUNT }}
          PROFILE: ${{ vars.AZURE_SIGNING_PROFILE }}
        run: |
          $dir = Join-Path $env:RUNNER_TEMP 'signing'
          # A fixed version: the newest one is not taken blindly.
          nuget install Microsoft.ArtifactSigning.Client -Version 1.0.151 -OutputDirectory $dir -ExcludeVersion -NonInteractive
          if ($LASTEXITCODE -ne 0) { throw 'The signing client could not be downloaded.' }
          $dlib = Get-ChildItem $dir -Recurse -Filter Azure.CodeSigning.Dlib.dll |
            Where-Object { $_.Directory.Name -eq 'x64' } | Select-Object -First 1
          if (-not $dlib) { throw 'Azure.CodeSigning.Dlib.dll (x64) is not in the signing client.' }
          $metadata = Join-Path $dir 'metadata.json'
          [ordered]@{
            Endpoint = $env:ENDPOINT
            CodeSigningAccountName = $env:ACCOUNT
            CertificateProfileName = $env:PROFILE
            CorrelationId = "$env:GITHUB_REPOSITORY@$env:GITHUB_SHA"
          } | ConvertTo-Json | Set-Content -Path $metadata -Encoding utf8
          "YTMP_SIGN_ARTIFACT_DLIB=$($dlib.FullName)" >> $env:GITHUB_ENV
          "YTMP_SIGN_ARTIFACT_METADATA=$metadata" >> $env:GITHUB_ENV
          # Set up means required: a signing failure stops the release.
          "YTMP_SIGN_REQUIRED=1" >> $env:GITHUB_ENV
      - name: Sign and package (normal + maximum overlay)
        shell: pwsh
        run: ./tools/package.ps1 -Prebuilt
      - name: Not the test build
        shell: pwsh
        run: ./tools/check-release-exe.ps1 -Files (Get-ChildItem dist/YT-Mini-Player-*-win64/*.exe).FullName
      - name: Signature status
        shell: pwsh
        run: |
          "| File | Signature | Signer |`n|---|---|---|" >> $env:GITHUB_STEP_SUMMARY
          Get-ChildItem dist/YT-Mini-Player-*-win64/*.exe | ForEach-Object {
            $sig = Get-AuthenticodeSignature -FilePath $_.FullName
            $signer = if ($sig.SignerCertificate) { $sig.SignerCertificate.GetNameInfo('SimpleName', $false) } else { '-' }
            "| $($_.Name) | $($sig.Status) | $signer |" >> $env:GITHUB_STEP_SUMMARY
          }
      - name: Provenance attestation
        uses: actions/attest-build-provenance@ef244123eb79f2f7a7e75d99086184180e6d0018 # v1
        with:
          subject-path: |
            dist/YT-Mini-Player-*-win64.zip
            dist/YT-Mini-Player-*-win64/*.exe
      - name: Publish
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $zip = Get-ChildItem dist/YT-Mini-Player-*-win64.zip | Select-Object -First 1
          $sums = Join-Path $zip.DirectoryName 'SHA256SUMS.txt'
          "{0}  {1}" -f (Get-FileHash -Algorithm SHA256 $zip.FullName).Hash.ToLowerInvariant(), $zip.Name | Set-Content $sums
          # The notes: docs/releases/<version>.md when there is one, without
          # its title line (the release has its own) and with this
          # repository's name in place of OWNER/REPO; otherwise GitHub's list.
          $notes = @('--generate-notes')
          $page = "docs/releases/$env:YTMP_VERSION.md"
          if (Test-Path -LiteralPath $page) {
            $body = (Get-Content -LiteralPath $page -Raw -Encoding utf8) -replace '^\s*# [^\r\n]*(\r?\n)+', ''
            $file = Join-Path $env:RUNNER_TEMP 'release-notes.md'
            Set-Content -LiteralPath $file -Value $body.Replace('OWNER/REPO', $env:GITHUB_REPOSITORY) -Encoding utf8 -NoNewline
            $notes = @('--notes-file', $file)
            "Release notes from $page"
          }
          gh release create $env:GITHUB_REF_NAME $zip.FullName $sums --title "YT Mini Player $env:GITHUB_REF_NAME" @notes

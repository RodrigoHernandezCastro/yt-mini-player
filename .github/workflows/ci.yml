# Checks on every push and pull request: tests, lint and dependency audit.
# Third-party actions are pinned to a version.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Rust tests
        run: cargo test --locked
      - name: Clippy (warnings = errors)
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: JavaScript tests
        run: |
          node tests/inject.test.js
          node tests/maintenance.test.js
          node tests/media.test.js
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Text keys used by the code exist in every language
        run: python tests/i18n_keys.py
      - name: End-to-end tests (Chromium)
        run: |
          pip install playwright==1.47.0 pillow==10.4.0
          python -m playwright install chromium
          python tests/ui_e2e.py
          python tests/home_e2e.py
          python tests/mini_e2e.py
          python tests/security_e2e.py
          python tests/music_e2e.py
          python tests/together_e2e.py
          python tests/share_e2e.py
      - name: Experience suite (journeys, accessibility, languages, contracts)
        run: python tests/suite.py --report suite-report
      - name: The live smoke test's own checks (stand-ins, healthy and changed)
        shell: bash
        run: |
          python tests/live_smoke.py --offline
          if python tests/live_smoke.py --offline --broken; then echo "a changed page went unnoticed"; exit 1; fi
      - name: Suite report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: suite-report
          path: suite-report
          if-no-files-found: ignore

  # The real program on real Windows: the drivable test build (src/e2e.rs)
  # with Playwright over CDP, two copies talking through a local relay, and
  # proof that a release would refuse that build.
  windows-e2e:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: e2e
      - name: Test build
        run: cargo build --release --locked --features e2e
      - name: A release refuses it
        shell: pwsh
        run: |
          $refused = $false
          try { ./tools/check-release-exe.ps1 -Files target/release/yt-mini-player.exe } catch { $refused = $true; Write-Host $_ }
          if (-not $refused) { throw 'check-release-exe.ps1 did not catch the test build' }
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Relay and Playwright
        shell: pwsh
        run: |
          npm install --prefix server/together-relay --no-audit --no-fund
          if ($LASTEXITCODE -ne 0) { throw 'npm install failed' }
          pip install playwright==1.47.0
          if ($LASTEXITCODE -ne 0) { throw 'pip install failed' }
      # The local relay (wrangler dev) starts in this same step, so nothing
      # between steps can stop it, and its log is shown if anything fails.
      - name: Start, Settings and Watch together on the real app
        shell: pwsh
        run: |
          $log = "$env:RUNNER_TEMP\wrangler.log"
          $err = "$env:RUNNER_TEMP\wrangler.err"
          $relay = Start-Process -FilePath node -ArgumentList 'node_modules/wrangler/bin/wrangler.js', 'dev', '--port', '8799', '--ip', '127.0.0.1' -WorkingDirectory server/together-relay -RedirectStandardOutput $log -RedirectStandardError $err -PassThru
          $null = $relay.Handle  # keeps its exit code readable once it has exited
          # Up when the worker answers (any HTTP status, its 404 for / too).
          # The first start on a fresh runner can be slow: up to 3 minutes.
          $started = Get-Date
          $up = $false
          while (-not $up -and -not $relay.HasExited -and ((Get-Date) - $started).TotalSeconds -lt 180) {
            try { Invoke-WebRequest -Uri http://127.0.0.1:8799/ -UseBasicParsing -TimeoutSec 5 | Out-Null; $up = $true }
            catch { if ($_.Exception.Response) { $up = $true } else { Start-Sleep -Seconds 1 } }
          }
          $code = 1
          if ($up) {
            "Relay up after $([int]((Get-Date) - $started).TotalSeconds) s"
            python tests/windows_e2e.py --exe target/release/yt-mini-player.exe --relay ws://127.0.0.1:8799
            $code = $LASTEXITCODE
          } else {
            "::error::The local relay does not answer on 127.0.0.1:8799 (wrangler $(if ($relay.HasExited) { "exited with $($relay.ExitCode)" } else { 'still starting after 3 minutes' }))."
          }
          if ($code -ne 0) {
            '--- relay log (wrangler dev) ---'
            Get-Content $log, $err -ErrorAction SilentlyContinue | Select-Object -Last 200
          }
          if (-not $relay.HasExited) { taskkill /T /F /PID $relay.Id | Out-Null }
          exit $code

  # The watch together relay, on a local copy of Cloudflare's runtime.
  relay:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server/together-relay
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Relay tests (wrangler dev)
        run: |
          npm install --no-audit --no-fund
          npm test

  supply-chain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Known vulnerabilities (RustSec), licenses, sources and duplicate or
      # banned crates (deny.toml).
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check advisories bans licenses sources
